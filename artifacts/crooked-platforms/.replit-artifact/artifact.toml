kind = "mobile"
previewPath = "/crooked-platforms/"
title = "Crooked Platforms"
description = "A mobile 2D troll-platformer prototype with an original oddball character, deceptive platforms, surprise traps, and short replayable levels for Android and iPhone."
version = "1.0.0"
id = "artifacts/crooked-platforms"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/crooked-platforms/" ]
localPort = 18324

[services.development]
run = "pnpm --filter @workspace/crooked-platforms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crooked-platforms", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/crooked-platforms", "run", "serve" ]

[services.env]
PORT = "18324"
BASE_PATH = "/crooked-platforms/"
